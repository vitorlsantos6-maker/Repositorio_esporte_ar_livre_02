<div class="container my-4">
  <h2>Cadastro de Cliente</h2>
  <form [formGroup]="form" (ngSubmit)="salvar()" class="card p-4 shadow-sm mt-3">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Nome Completo</label>
        <input type="text" class="form-control" formControlName="nome">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">CPF (somente números)</label>
        <input type="text" class="form-control" formControlName="cpf">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" formControlName="dataNascimento">
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" formControlName="email">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" formControlName="telefone">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Sexo</label>
        <select class="form-select" formControlName="sexo">
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>
      </div>
    </div>

    <div formGroupName="endereco" class="border-top pt-3 mt-2">
      <h5>Endereço</h5>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Logradouro</label>
          <input type="text" class="form-control" formControlName="logradouro">
        </div>
        <div class="col-md-2 mb-3">
          <label class="form-label">Número</label>
          <input type="text" class="form-control" formControlName="numero">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Bairro</label>
          <input type="text" class="form-control" formControlName="bairro">
        </div>
      </div>
      <div class="row">
        <div class="col-md-5 mb-3">
          <label class="form-label">Cidade</label>
          <input type="text" class="form-control" formControlName="cidade">
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label">UF</label>
          <input type="text" class="form-control" formControlName="uf" maxlength="2">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">CEP</label>
          <input type="text" class="form-control" formControlName="cep">
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary" [disabled]="salvando">Salvar</button>
      <button type="button" class="btn btn-secondary" (click)="limpar()">Limpar</button>
    </div>
  </form>
</div>
